spring:
  cache:
    type: redis
    cache-names: orders
    redis:
      time-to-live: 10m
      # Bump the version when the cached OrderDetails shape changes, so old entries are never read.
      key-prefix: "shopflow:v2:"
      use-key-prefix: true
      cache-null-values: false
  data:
    redis:
      host: localhost
      port: 6379
      # Fail fast when Redis is unavailable so reads fall back to the database quickly.
      # The client default command timeout is 60s.
      timeout: 500ms
      connect-timeout: 1s

management:
  health:
    redis:
      enabled: true
