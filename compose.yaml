# DEVELOPMENT ONLY. Every credential in this file and in order-platform/keycloak/shopflow-realm.json is a committed,
# well-known value (Postgres shopflow/shopflow and inventory/inventory, Keycloak admin/admin, users alice and bob, the
# shopflow-service secret). Never reuse them outside a laptop or a test run; see order-platform/keycloak/README.md.
services:
  postgres:
    # Orders database; only started with the 'orders' profile so each app's service-connection detection sees one PostgreSQL.
    profiles: [orders]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shopflow
      POSTGRES_USER: shopflow
      POSTGRES_PASSWORD: shopflow
    ports:
      # Container port only: Docker picks a free host port and Spring Boot finds it.
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopflow -d shopflow"]
      interval: 2s
      timeout: 3s
      retries: 15

  keycloak:
    # Identity provider for local development only (start-dev: H2 database inside the container,
    # plain HTTP, no persistence between `down`s). Imports the "shopflow" realm on first start:
    # roles customer, admin and inventory, users alice (customer) and bob (admin), public client shopflow-web.
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    ports:
      # Fixed host port: 8080 is order-platform, 8081 inventory-service.
      - "8180:8080"
    environment:
      # Admin console login at http://localhost:8180 (dev only).
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Serves /health/ready on the management port 9000 inside the container.
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./order-platform/keycloak/shopflow-realm.json:/opt/keycloak/data/import/shopflow-realm.json:ro
    healthcheck:
      # The image has no curl; talk HTTP through bash's /dev/tcp.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; timeout --preserve-status 1 cat <&3 | grep -m 1 status | grep -m 1 UP; ERROR=$$?; exec 3<&-; exec 3>&-; exit $$ERROR"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  kafka:
    # Single node in KRaft mode: one process is both broker and controller, no ZooKeeper.
    image: apache/kafka:4.3.2
    ports:
      # Fixed host port: the broker advertises localhost:9092 to clients, so it must match.
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # One broker, so the internal topics cannot be replicated more than once.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  postgres-inventory:
    # Inventory database; only started with the 'inventory' profile.
    profiles: [inventory]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    ports:
      # Fixed host port 5433 (the orders database gets a random host port).
      - "5433:5432"
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  inventory-db-data:
