spring.application.name=inventory-service
# PLACEHOLDER: this module has no stock endpoints yet (see inventory-service/README.md). order-platform
# reaches inventory at shopflow.inventory.base-url (http://localhost:8081), where locally the WireMock
# stand-in from deploy/wiremock runs. The port is set so this app never clashes with order-platform on 8080.
server.port=8081
# Shared infrastructure lives in the root compose.yaml. start-only: this app never stops the Kafka and
# Keycloak that order-platform uses too. The profile picks this app's database (postgres-inventory).
spring.docker.compose.file=../compose.yaml
spring.docker.compose.lifecycle-management=start-only
spring.docker.compose.profiles.active=inventory
